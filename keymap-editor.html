<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Gridaria キーマップエディター</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Yu Gothic UI", "Meiryo", sans-serif;
      background: #11141a;
      color: #e5e7eb;
      font-synthesis: none;
      --panel: #1a1f28;
      --border: #373f4c;
      --muted: #aab2c0;
      --accent: #8b9cff;
    }

    * { box-sizing: border-box; }

    body { margin: 0; min-width: 320px; }

    button, input { font: inherit; }

    button {
      color: inherit;
      cursor: pointer;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    header, .toolbar, .section-heading, .layer-tabs, .custom-form {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    header { margin-bottom: 24px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(22px, 4vw, 30px); letter-spacing: .02em; }
    h2 { font-size: 16px; }
    .subtitle, .hint, .status, .key-index { color: var(--muted); }
    .subtitle { margin-top: 7px; font-size: 14px; }
    .toolbar { flex-wrap: wrap; justify-content: flex-end; }

    .button {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #2b313c;
      font-weight: 650;
    }

    .button:hover:not(:disabled) { background: #39414e; }
    .button.primary { background: #697af0; border-color: #8390ff; color: #fff; }
    .button.primary:hover:not(:disabled) { background: #7a89ff; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button.link { text-decoration: none; }
    .file-input { display: none; }

    .info, .panel {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .info {
      margin-bottom: 20px;
      padding: 14px 17px;
      color: #c4cee0;
      font-size: 13px;
      line-height: 1.7;
    }

    .info strong { color: #f0f3fa; }
    .panel { padding: 20px; margin-bottom: 18px; }
    .section-heading { margin-bottom: 16px; }
    .section-heading .hint { font-size: 12px; text-align: right; }
    .status { margin: 0 0 14px; font-size: 13px; }
    .status.error { color: #ff9b9b; }
    .status.success { color: #8ee0b3; }

    .layer-tabs {
      justify-content: flex-start;
      flex-wrap: wrap;
      margin: 0 0 20px;
    }

    .layer-tab {
      min-width: 72px;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #282e38;
    }

    .layer-tab[aria-pressed="true"] {
      border-color: var(--accent);
      background: #394154;
      color: #fff;
    }

    .keyboard-scroll { overflow-x: auto; padding: 3px 2px 12px; }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(13, minmax(48px, 1fr));
      gap: 9px;
      min-width: 780px;
    }

    .key {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 67px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 7px 4px;
      border: 1px solid #3b414b;
      border-radius: 9px;
      background: linear-gradient(155deg, #252a35, #1b2029);
      box-shadow: 0 3px 0 #111827;
      text-align: center;
      overflow-wrap: anywhere;
      transition: border-color .12s, background .12s, transform .12s;
    }

    .key:hover, .key.selected {
      border-color: #a3adff;
      background: #39414e;
    }

    .key.drop-target {
      border-color: #a3f2cc;
      background: #24544b;
      transform: translateY(-2px);
    }

    .key.transparent {
      border-style: dashed;
      background: #242a34;
      color: #aab2c0;
    }

    .key-label { font-size: 13px; font-weight: 750; line-height: 1.15; }
    .key-detail { color: #afbdd4; font-size: 9px; line-height: 1.2; }
    .key-index { position: absolute; top: 4px; left: 6px; font-size: 9px; }

    .keyboard-fader {
      position: relative;
      z-index: 1;
      display: grid;
      grid-column: 6 / 9;
      grid-row: 1 / 5;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: 26px repeat(7, minmax(0, 1fr));
      align-items: center;
      min-height: 0;
      padding: 8px 14px;
      border: 1px solid #3c444f;
      border-radius: 10px;
      background: linear-gradient(145deg, #252a35, #171c27);
      box-shadow: inset 0 0 0 3px #111722, 0 3px 0 #111827;
    }

    .keyboard-fader-track {
      position: relative;
      z-index: 0;
      grid-column: 1 / -1;
      grid-row: 2 / 9;
      align-self: stretch;
      justify-self: center;
      width: 8px;
      border: 1px solid #707b91;
      border-radius: 999px;
      background: #0b1020;
      pointer-events: none;
    }

    .keyboard-fader-led {
      z-index: 1;
      grid-column: 1 / 3;
      justify-self: center;
      width: 11px;
      height: 11px;
      border: 1px solid color-mix(in srgb, var(--led-color), white 38%);
      border-radius: 50%;
      background: var(--led-color);
      box-shadow: 0 0 5px color-mix(in srgb, var(--led-color), transparent 25%),
        0 0 10px color-mix(in srgb, var(--led-color), transparent 45%),
        inset 0 1px 2px rgb(255 255 255 / 75%);
      transform: translateX(-17.5px);
    }

    .keyboard-power-switch {
      position: absolute;
      left: 75%;
      bottom: 15px;
      z-index: 2;
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      padding: 3px;
      border: 1px solid #777f8c;
      border-radius: 50%;
      background: #20252e;
      color: #c1c8d3;
      font-size: 8px;
      line-height: 1.3;
      text-align: center;
      white-space: pre-line;
      pointer-events: none;
      transform: translateX(-15%);
    }

    .keyboard-fader-title {
      z-index: 1;
      grid-column: 1 / -1;
      grid-row: 1;
      color: #aeb9ce;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-align: center;
    }

    .keyboard-fader-point {
      z-index: 1;
      justify-self: center;
      display: grid;
      grid-column: 1 / -1;
      width: min(64px, 100%);
      min-width: 42px;
      min-height: 24px;
      place-items: center;
      padding: 2px 5px;
      border: 1px solid #56637b;
      border-radius: 5px;
      background: linear-gradient(180deg, #343b48, #222936);
      box-shadow: 0 2px 0 #0b1020;
      color: #f3f4f6;
      font-size: 11px;
      font-weight: 750;
    }

    .keyboard-fader-point:hover:not(:disabled),
    .keyboard-fader-point:focus-visible { border-color: #c2caff; background: #46515f; }
    .keyboard-fader-point:disabled { cursor: not-allowed; opacity: .5; }
    .keyboard-fader-point:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .palette-tools { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }

    input[type="search"], input[type="text"], select {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: #20252e;
      color: #f3f4f6;
    }

    input:focus { border-color: var(--accent); }
    #search { width: min(360px, 100%); }
    #category-filter { min-width: 150px; }

    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 8px;
      max-height: 290px;
      overflow-y: auto;
      padding: 2px 4px 5px 2px;
    }

    .candidate {
      min-height: 49px;
      padding: 7px 8px;
      border: 1px solid #373f4c;
      border-radius: 8px;
      background: #252a35;
      text-align: left;
    }

    .candidate:hover, .candidate.selected {
      border-color: var(--accent);
      background: #343b48;
    }

    .candidate-label { display: block; font-size: 12px; font-weight: 700; }
    .candidate-code {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .custom-form { justify-content: flex-start; margin-top: 15px; }
    .custom-form input { flex: 1; max-width: 380px; }
    .empty { grid-column: 1 / -1; padding: 14px; color: var(--muted); font-size: 13px; }
    .footer-note { margin-top: 14px; color: var(--muted); font-size: 12px; line-height: 1.6; }

    @media (max-width: 650px) {
      .app { padding: 22px 14px 36px; }
      header { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
      .panel { padding: 15px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .section-heading .hint { text-align: left; }
      .custom-form { align-items: stretch; flex-direction: column; }
      .custom-form input { max-width: none; }
      .keyboard-fader { padding-right: 6px; padding-left: 6px; }
      .keyboard-fader-point { min-width: 34px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>Gridaria キーマップエディター</h1>
      </div>
      <div class="toolbar">
        <button class="button primary" id="connect-button" type="button">キーボードに接続</button>
        <button class="button" id="disconnect-button" type="button" hidden>切断</button>
        <button class="button primary" id="device-save-button" type="button" disabled>キーボードに保存</button>
        <button class="button" id="restore-stock-button" type="button" disabled>初期設定に戻す</button>
        <label class="button" for="file-picker">キーマップを開く</label>
        <input class="file-input" id="file-picker" type="file" accept=".keymap,.txt">
        <button class="button" id="save-button" type="button" disabled>ファイルに保存</button>
      </div>
    </header>

    <p class="status" id="status" role="status" aria-live="polite">USBキーボードに接続するか、キーマップファイルを開いてください。</p>

    <section class="panel" aria-labelledby="keyboard-heading">
      <div class="section-heading">
        <h2 id="keyboard-heading">キーボード</h2>
        <span class="hint" id="key-count">Gridaria · 38キー</span>
      </div>
      <nav class="layer-tabs" id="layer-tabs" aria-label="レイヤー"></nav>
      <div class="keyboard-scroll">
        <div class="keyboard" id="keyboard" aria-label="Gridaria キーボード"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="palette-heading">
      <div class="section-heading">
        <h2 id="palette-heading">キー候補</h2>
        <span class="hint" id="selection-hint">候補を選択してキーに割り当てます。ドラッグにも対応しています。</span>
      </div>
      <div class="palette-tools">
        <input id="search" type="search" placeholder="候補を検索…" aria-label="キー候補を検索">
        <select id="category-filter" aria-label="キー候補の分類">
          <option value="all">すべての分類</option>
          <option value="letters">アルファベット</option>
          <option value="numbers">数字</option>
          <option value="symbols">記号・句読点</option>
          <option value="control">制御・空白</option>
          <option value="navigation">ナビゲーション</option>
          <option value="locks">ロック</option>
          <option value="function">ファンクションキー</option>
          <option value="international">国際キー</option>
          <option value="language">言語</option>
          <option value="miscellaneous">その他のキー</option>
          <option value="keypad-numbers">テンキーの数字</option>
          <option value="keypad-operations">テンキーの記号・演算</option>
          <option value="cut-copy-paste">切り取り・コピー・貼り付け</option>
          <option value="undo-redo">元に戻す・やり直し</option>
          <option value="sound">音量・サウンド</option>
          <option value="display">ディスプレイ</option>
          <option value="media">メディア操作</option>
          <option value="consumer-menus">メニュー操作</option>
          <option value="consumer-controls">コンシューマー操作</option>
          <option value="application-controls">アプリケーション操作</option>
          <option value="applications">アプリの起動</option>
          <option value="input-assist">入力支援</option>
          <option value="power-lock">電源・ロック</option>
          <option value="layer">レイヤー操作</option>
          <option value="other">その他の動作</option>
        </select>
      </div>
      <div class="palette" id="palette"></div>
      <form class="custom-form" id="custom-form">
        <input id="custom-binding" type="text" placeholder="例: &kp F11" autocomplete="off" aria-label="カスタムバインディング">
        <button class="button" type="submit">カスタム候補を追加</button>
      </form>
      <p class="footer-note">候補にはZMK公式の<a href="https://zmk.dev/docs/keymaps/list-of-keycodes" target="_blank" rel="noopener noreferrer">キーコード一覧</a>にある有効なキーコードを収録しています。同じ動作をする別名は1つにまとめています。USB接続にはWeb Serial対応ブラウザー（Chrome / Edge）とインターネット接続が必要です。キーマップのレイヤー追加・削除はできません。ローカルファイルの保存とキーボード本体への保存は別々の操作です。</p>
    </section>
  </main>

      function setStatus(message, kind = "") {

      function deviceBindingKey(binding) {
        return `@${binding.behaviorId}:${binding.param1}:${binding.param2}`;
      }

      function parseKeymap(source) {
        const layers = new Map();
        const layerPattern = /layer_(\d+)\s*\{[\s\S]*?\bbindings\s*=\s*<([\s\S]*?)>\s*;/g;
        let match;

        while ((match = layerPattern.exec(source)) !== null) {
          const number = Number(match[1]);
          if (layers.has(number)) {
            throw new Error(`レイヤー ${number} が重複しています。`);
          }

          const content = match[2];
          const contentStart = match.index + match[0].indexOf(content);
          const bindingStarts = [...content.matchAll(/&[A-Za-z_][A-Za-z0-9_]*/g)];
          const bindings = bindingStarts.map((binding, index) => {
            const start = binding.index;
            const nextStart = index + 1 < bindingStarts.length ? bindingStarts[index + 1].index : content.length;
            const raw = content.slice(start, nextStart);
            const token = raw.trim();
            if (!token) {
              throw new Error(`レイヤー ${number} に空のキーがあります。`);
            }
            return {
              value: token,
              start: contentStart + start,
              end: contentStart + start + raw.trimEnd().length
            };
          });

          layers.set(number, bindings);
        }

        for (const number of layerNumbers) {
          if (!layers.has(number)) {
            throw new Error(`レイヤー ${number} が見つかりません。Gridaria の8レイヤーのキーマップを選択してください。`);
          }
          if (layers.get(number).length !== KEYS_PER_LAYER) {
            throw new Error(`レイヤー ${number} のキー数が${KEYS_PER_LAYER}個ではありません（${layers.get(number).length}個）。`);
          }
        }
        if (layers.size !== LAYER_COUNT) {
          throw new Error("Gridaria のレイヤー数と一致しません。レイヤーの追加・削除されたファイルは編集できません。");
        }

        return layerNumbers.map((number) => ({ number, bindings: layers.get(number) }));
      }

      function bindingLabel(binding) {
        if (binding === "&trans") return ["TRNS", "透過"];
        if (binding === "&none") return ["NONE", "無効"];
        if (binding.startsWith("@") && state.device) {
          const [behaviorId, param1, param2] = binding.slice(1).split(":").map(Number);
          const behavior = state.device.behaviors.get(behaviorId);
          if (!behavior) return [`Behavior ${behaviorId}`, `${param1}, ${param2}`];

          if (/key press/i.test(behavior.displayName)) {
            const key = keycodeByUsage.get(param1) || keycodeByUsage.get(0x70000 | param1);
            return [key ? displayKeycodeName(key) : `Key ${param1}`, behavior.displayName];
          }
          const layerBehavior = layerBehaviorTypes.find(({ displayName }) =>
            displayName.toLowerCase() === behavior.displayName.toLowerCase()
          );
          if (layerBehavior) {
            const layer = param1;
            const keyCode = layerBehavior.code === "lt"
              ? keycodeByUsage.get(param2) || keycodeByUsage.get(0x70000 | param2) || `Key ${param2}`
              : null;
            return [
              `${layerBehavior.label} ${layer}${keyCode ? ` / ${displayKeycodeName(keyCode)}` : ""}`,
              layerBehavior.detail
            ];
          }
          return [behavior.displayName, `${param1}, ${param2}`];
        }
        const parts = binding.split(/\s+/);
        const behavior = parts[0].slice(1);
        const args = parts.slice(1);

        if (behavior === "kp" && args.length) {
          const key = args.join(" ").replace(/^LC\((.+)\)$/, "Ctrl+$1")
            .replace(/^LS\((.+)\)$/, "Shift+$1")
            .replace(/^LA\((.+)\)$/, "Alt+$1")
            .replace(/^LG\((.+)\)$/, "GUI+$1");
          return [displayKeycodeName(key), "キー"];
        }
        const layerBehavior = layerBehaviorTypes.find(({ code }) => code === behavior);
        if (layerBehavior && args.length) {
          const keyCode = behavior === "lt" ? args[1] : null;
          return [
            `${layerBehavior.label} ${args[0]}${keyCode ? ` / ${displayKeycodeName(keyCode)}` : ""}`,
            layerBehavior.detail
          ];
        }
        if (behavior === "mt" && args.length > 1) return [args[1], `MT · ${args[0]}`];
        if (behavior === "lt" && args.length > 1) return [args[1], `LAYER ${args[0]}`];
        if (behavior === "td_CS") return [",", "タップダンス"];
        if (behavior === "td_DC") return [".", "タップダンス"];
        if (behavior === "td_CME") return ["/", "タップダンス"];
        if (behavior.startsWith("jp_")) return [behavior.slice(3).toUpperCase(), "日本語マクロ"];
        return [args.length ? args.join(" ") : behavior.toUpperCase(), behavior.toUpperCase()];
      }

      function candidateCategory(candidate) {
        if (candidate.startsWith("@") && state.device) {
          const [behaviorId, param1] = candidate.slice(1).split(":").map(Number);
          const behavior = state.device.behaviors.get(behaviorId);
          if (layerBehaviorTypes.some(({ displayName }) =>
            displayName.toLowerCase() === behavior?.displayName.toLowerCase()
          )) return "layer";
          return keycodeCategoryByUsage.get(param1) || "other";
        }
        if (/^&(mo|to|tog|lt)\s/.test(candidate)) return "layer";
        const keycode = candidate.match(/^&kp\s+([A-Z0-9_]+)$/);
        return keycode ? keycodeByCode.get(keycode[1])?.category || "other" : "other";
      }

      function candidateOrder(candidate) {
        let code;
        if (candidate.startsWith("@") && state.device) {
          const [behaviorId, param1, param2] = candidate.slice(1).split(":").map(Number);
          const behavior = state.device.behaviors.get(behaviorId);
          const layerBehavior = layerBehaviorTypes.find(({ displayName }) =>
            displayName.toLowerCase() === behavior?.displayName.toLowerCase()
          );
          if (layerBehavior) {
            const layer = param1;
            const key = layerBehavior.code === "lt"
              ? keycodeByUsage.get(param2) || keycodeByUsage.get(0x70000 | param2)
              : "";
            return layerBehaviorCandidateOrder(layerBehavior, layer, key);
          }
          code = keycodeByUsage.get(param1) || keycodeByUsage.get(0x70000 | param1);
        } else {
          code = candidate.match(/^&kp\s+([A-Z0-9_]+)$/)?.[1];
          const layerBinding = candidate.match(/^&(mo|to|tog|lt)\s+(\d+)(?:\s+([A-Z0-9_]+))?$/);
          if (layerBinding) {
            const behavior = layerBehaviorTypes.find(({ code: behaviorCode }) => behaviorCode === layerBinding[1]);
            return layerBehaviorCandidateOrder(behavior, Number(layerBinding[2]), layerBinding[3]);
          }
        }
        return officialKeycodeRanks.get(code) ?? Number.MAX_SAFE_INTEGER;
      }

      function layerBehaviorCandidateOrder(behavior, layer, key) {
        const behaviorIndex = layerBehaviorTypes.indexOf(behavior);
        return keycodeCatalog.length + 1 + behaviorIndex * LAYER_COUNT * keycodeCatalog.length
          + layer * keycodeCatalog.length + (keycodeByCode.get(key)?.order || 0);
      }

      function refreshCandidates() {
        if (state.device?.keymap) {
          const candidates = new Map();
          for (const layer of state.device.keymap.layers) {
            for (const binding of layer.bindings) {
              candidates.set(deviceBindingKey(binding), binding);
            }
          }

          const keyPress = [...state.device.behaviors.values()].find((behavior) =>
            /key press/i.test(behavior.displayName)
          );
          if (keyPress) {
            for (const { usage } of keycodeCatalog) {
              const binding = { behaviorId: keyPress.id, param1: usage, param2: 0 };
              candidates.set(deviceBindingKey(binding), binding);
            }
          }
          for (const layerBehavior of layerBehaviorTypes) {
            const behavior = [...state.device.behaviors.values()].find(({ displayName }) =>
              displayName.toLowerCase() === layerBehavior.displayName.toLowerCase()
            );
            if (!behavior) continue;
            for (let layer = 0; layer < state.device.keymap.layers.length; layer++) {
              const binding = {
                behaviorId: behavior.id,
                param1: layer,
                param2: layerBehavior.code === "lt" ? keycodeByCode.get("SPACE").usage : 0
              };
              candidates.set(deviceBindingKey(binding), binding);
            }
          }

          state.device.candidateBindings = candidates;
          state.candidateBindings = candidates;
          state.candidates = [...candidates.keys()];
          renderPalette();
          return;
        }

        state.candidateBindings = new Map();
        const currentBindings = state.layers.flatMap((layer) => layer.bindings.map((binding) => binding.value));
        state.candidates = [...new Set([...baseCandidates, ...currentBindings])];
        renderPalette();
      }

      function renderLayerTabs() {
        elements.layerTabs.replaceChildren();
        const layers = state.device?.keymap?.layers ?? layerNumbers.map((number) => ({ name: `レイヤー ${number}` }));
        for (const [number, layer] of layers.entries()) {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "layer-tab";
          tab.textContent = layer.name || `レイヤー ${number}`;
          tab.setAttribute("aria-pressed", String(state.activeLayer === number));
          tab.addEventListener("click", () => {
            state.activeLayer = number;
            state.selectedCandidate = null;
            state.selectedKey = null;
            elements.selectionHint.textContent = "候補を選択してキーに割り当てます。ドラッグにも対応しています。";
            renderPalette();
            renderLayerTabs();
            renderKeyboard();
          });
          elements.layerTabs.append(tab);
        }
      }

      function renderKeyboard() {
        elements.keyboard.replaceChildren();
        const layer = state.device?.keymap?.layers[state.activeLayer] ?? state.layers[state.activeLayer];
        const bindings = layer?.bindings ?? Array(KEYS_PER_LAYER).fill(null);

        bindings.forEach((binding, index) => {
          const row = index < 30 ? Math.floor(index / 10) : 3;
          const column = index < 30 ? (index % 10 < 5 ? index % 10 + 1 : index % 10 + 4) : bottomColumns[index - 30];
          const key = document.createElement("button");
          const bindingValue = binding ? state.device ? deviceBindingKey(binding) : binding.value : "";
          const [label, detail] = binding ? bindingLabel(bindingValue) : ["", ""];
          key.type = "button";
          key.disabled = !binding;
          key.className = `key${!binding ? " placeholder" : bindingValue === "&trans" ? " transparent" : ""}${state.selectedKey === index ? " selected" : ""}`;
          key.style.gridColumn = `${column}${row === 3 && (index === 33 || index === 34) ? " / span 2" : ""}`;
          key.style.gridRow = String(row + 1);
          key.title = binding ? `キー ${index + 1}: ${state.device ? `${label} (${bindingValue})` : bindingValue}` : `キー ${index + 1}`;
          key.setAttribute("aria-label", key.title);
          key.innerHTML = `<span class="key-index">${index + 1}</span><span class="key-label"></span><span class="key-detail"></span>`;
          key.querySelector(".key-label").textContent = label;
          key.querySelector(".key-detail").textContent = detail;
          if (!binding) {
            elements.keyboard.append(key);
            return;
          }
          key.addEventListener("click", () => {
            if (state.selectedCandidate) {
              assignBinding(index, state.selectedCandidate);
            } else {
              state.selectedKey = index;
              renderKeyboard();
              elements.selectionHint.textContent = `キー ${index + 1} を選択中 · ${bindingValue}`;
            }
          });
          key.addEventListener("dragover", (event) => {
            if (state.selectedCandidate || event.dataTransfer.types.includes("text/plain")) {
              event.preventDefault();
              key.classList.add("drop-target");
            }
          });
          key.addEventListener("dragleave", () => key.classList.remove("drop-target"));
          key.addEventListener("drop", (event) => {
            event.preventDefault();
            key.classList.remove("drop-target");
            const value = event.dataTransfer.getData("text/plain");
            if (isValidBinding(value)) assignBinding(index, value);
          });
          elements.keyboard.append(key);
        });
        renderKeyboardFader();
      }

      function renderKeyboardFader() {
        elements.keyboard.querySelector(".keyboard-fader")?.remove();
        const device = state.device;
        const fileFaderLayer = !device && state.layers[6];
        const faderLayer = device?.loaded ? device.faderSettingsLayer : fileFaderLayer;
        const supported = device?.loaded
          ? Boolean(device.faderSettingsLayer && device.faderBehaviorId)
          : Boolean(fileFaderLayer?.bindings.slice(0, 7).every((binding) =>
            /^&fader_layer\s+[0-6]$/.test(binding.value)));
        const fader = document.createElement("div");
        fader.className = "keyboard-fader";
        fader.setAttribute("role", "group");
        fader.setAttribute("aria-label", "中央フェーダー。目盛りをクリックして割り当てを変更");
        const title = document.createElement("span");
        title.className = "keyboard-fader-title";
        title.textContent = "FADER";
        fader.append(title);

        const track = document.createElement("div");
        track.className = "keyboard-fader-track";
        track.setAttribute("aria-hidden", "true");
        fader.append(track);

        const ledColors = ["#43aaff", "#37d6ff", "#4ae477", "#fff4c5", "#ffdf4d", "#ff9c3d", "#ff5847"];
        for (let visualPosition = 6; visualPosition >= 0; visualPosition--) {
          const row = 8 - visualPosition;
          const led = document.createElement("span");
          led.className = "keyboard-fader-led";
          led.style.setProperty("--led-color", ledColors[6 - visualPosition]);
          led.style.gridRow = String(row);
          led.setAttribute("aria-hidden", "true");
          fader.append(led);

          const binding = faderLayer?.bindings[visualPosition];
          const targetLayer = device?.loaded
            ? binding?.param1
            : Number(binding?.value.match(/^&fader_layer\s+([0-6])$/)?.[1]);
          const point = document.createElement("button");
          point.type = "button";
          point.className = "keyboard-fader-point";
          point.style.gridRow = String(row);
          point.disabled = !supported || Boolean(device?.saving);
          point.textContent = Number.isFinite(targetLayer) ? `L${targetLayer}` : "—";
          point.title = supported
            ? `フェーダー位置 ${visualPosition + 1}（${visualPosition === 6 ? "上端" : visualPosition === 0 ? "下端" : ""}）: レイヤー ${targetLayer}。クリックで次のレイヤーに変更`
            : "このキーマップには編集可能なフェーダー設定がありません";
          point.setAttribute("aria-label", point.title);
          point.addEventListener("click", () => {
            if (supported) void assignFaderLayer(visualPosition, (targetLayer + 1) % 7);
          });
          fader.append(point);
        }

        const powerSwitch = document.createElement("div");
        powerSwitch.className = "keyboard-power-switch";
        powerSwitch.setAttribute("role", "img");
        powerSwitch.setAttribute("aria-label", "電源オン・オフスイッチのイラスト");
        powerSwitch.textContent = "";
        fader.append(powerSwitch);

        elements.keyboard.append(fader);
      }

      function renderPalette() {
        const query = elements.search.value.trim().toLowerCase();
        const selectedCategory = elements.categoryFilter.value;
        const matching = state.candidates.filter((candidate) => {
          const [label, detail] = bindingLabel(candidate);
          const matchesQuery = `${candidate} ${label} ${detail}`.toLowerCase().includes(query);
          return matchesQuery && (selectedCategory === "all" || candidateCategory(candidate) === selectedCategory);
        }).sort((left, right) => candidateOrder(left) - candidateOrder(right));
        elements.palette.replaceChildren();

        if (!matching.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "一致する候補がありません。";
          elements.palette.append(empty);
          return;
        }

        for (const candidate of matching) {
          const [label] = bindingLabel(candidate);
          const button = document.createElement("button");
          button.type = "button";
          button.className = `candidate${state.selectedCandidate === candidate ? " selected" : ""}`;
          button.draggable = true;
          button.title = candidate;
          button.setAttribute("aria-label", `${label} (${candidate})`);
          button.innerHTML = '<span class="candidate-label"></span><span class="candidate-code"></span>';
          button.querySelector(".candidate-label").textContent = label;
          button.querySelector(".candidate-code").textContent = candidate;
          button.addEventListener("click", () => {
            state.selectedCandidate = candidate;
            state.selectedKey = null;
            elements.selectionHint.textContent = `選択中: ${candidate} · 割り当てるキーをクリックしてください。`;
            renderPalette();
            renderKeyboard();
          });
          button.addEventListener("dragstart", (event) => {
            event.dataTransfer.setData("text/plain", candidate);
            event.dataTransfer.effectAllowed = "copy";
          });
          elements.palette.append(button);
        }
      }

      function isValidBinding(value) {
        return /^&[A-Za-z_][A-Za-z0-9_]*(?:\s+[A-Za-z0-9_(),.+-]+)*$/.test(value);
      }

      function assignBinding(index, value) {
        if (!isValidBinding(value)) {
          if (!state.device || !value.startsWith("@")) {
            setStatus("キー候補の形式が正しくありません。", "error");
            return;
          }
        }
        if (state.device) {
          void assignDeviceBinding(index, value);
          return;
        }
        const binding = state.layers[state.activeLayer].bindings[index];
        if (binding.value === value) {
          state.selectedKey = index;
          renderKeyboard();
          return;
        }

        state.source = state.source.slice(0, binding.start) + value + state.source.slice(binding.end);
        try {
          state.layers = parseKeymap(state.source);
        } catch (error) {
          setStatus(`編集内容を適用できませんでした: ${error.message}`, "error");
          return;
        }
        state.dirty = true;
        state.selectedKey = index;
        elements.saveButton.disabled = false;
        setStatus(`レイヤー ${state.activeLayer} のキー ${index + 1} を変更しました。保存してファイルをダウンロードしてください。`, "success");
        refreshCandidates();
        renderKeyboard();
      }

      async function assignDeviceBinding(index, candidate) {
        const device = state.device;
        const layer = device?.keymap.layers[state.activeLayer];
        const binding = device?.candidateBindings.get(candidate);
        if (!device || !layer || !binding) {
          setStatus("接続中のキーマップから候補を取得できません。再接続してください。", "error");
          return;
        }

        await setDeviceLayerBinding(layer, index, binding);
      }

      async function assignFaderLayer(position, targetLayer) {
        const device = state.device;
        if (device?.loaded && device.faderSettingsLayer && device.faderBehaviorId) {
          const binding = {
            behaviorId: device.faderBehaviorId,
            param1: targetLayer,
            param2: 0
          };
          await setDeviceLayerBinding(device.faderSettingsLayer, position, binding);
          return;
        }

        const binding = state.layers[6]?.bindings[position];
        if (!binding || !/^&fader_layer\s+[0-6]$/.test(binding.value)) return;
        const value = `&fader_layer ${targetLayer}`;
        state.source = state.source.slice(0, binding.start) + value + state.source.slice(binding.end);
        try {
          state.layers = parseKeymap(state.source);
        } catch (error) {
          setStatus(`フェーダー設定を適用できませんでした: ${error.message}`, "error");
          return;
        }
        state.dirty = true;
        elements.saveButton.disabled = false;
        setStatus(`フェーダー位置 ${position + 1} をレイヤー ${targetLayer} に変更しました。保存してファイルをダウンロードしてください。`, "success");
        renderKeyboardFader();
      }

      async function setDeviceLayerBinding(layer, index, binding) {
        const device = state.device;
        if (!device) return;
        try {
          const response = await device.client.call_rpc(device.connection, {
            keymap: {
              setLayerBinding: {
                layerId: layer.id,
                keyPosition: index,
                binding
              }
            }
          });
          if (response.keymap?.setLayerBinding !== 0) {
            throw new Error(`キー変更に失敗しました (応答: ${response.keymap?.setLayerBinding ?? "なし"})`);
          }

          layer.bindings[index] = { ...binding };
          device.dirty = true;
          elements.deviceSaveButton.disabled = false;
          state.selectedKey = index;
          setStatus("キーボードへ変更を適用しました。電源を切る前に「キーボードに保存」を押してください。", "success");
          refreshCandidates();
          renderKeyboard();
        } catch (error) {
          setStatus(`キーボードへ変更を適用できませんでした: ${error.message}`, "error");
        }
      }

      async function loadDeviceKeymap(device) {
        if (device.loading || device.loaded || state.device !== device) return;
        device.loading = true;
        setStatus("キーボードのキーマップとキー候補を読み込んでいます。");
        try {
          const keymapResponse = await device.client.call_rpc(device.connection, {
            keymap: { getKeymap: true }
          });
          const keymap = keymapResponse.keymap?.getKeymap;
          if (!keymap || keymap.layers.length !== LAYER_COUNT) {
            throw new Error(`Gridariaの8レイヤーを取得できませんでした (${keymap?.layers.length ?? 0}レイヤー)。Studio対応ファームウェアを確認してください。`);
          }
          for (const [index, layer] of keymap.layers.entries()) {
            if (layer.bindings.length !== KEYS_PER_LAYER) {
              throw new Error(`レイヤー ${index} のキー数が${KEYS_PER_LAYER}個ではありません (${layer.bindings.length}個)。`);
            }
          }

          const behaviorList = await device.client.call_rpc(device.connection, {
            behaviors: { listAllBehaviors: true }
          });
          const behaviorIds = behaviorList.behaviors?.listAllBehaviors?.behaviors ?? [];
          const behaviors = new Map();
          for (const behaviorId of behaviorIds) {
            const response = await device.client.call_rpc(device.connection, {
              behaviors: { getBehaviorDetails: { behaviorId } }
            });
            const details = response.behaviors?.getBehaviorDetails;
            if (details) behaviors.set(details.id, details);
          }
          const faderBehavior = [...behaviors.values()].find((behavior) => behavior.displayName === "Fader Layer");
          const faderSettingsLayer = keymap.layers.find((layer) => layer.id === 6);
          if (!faderBehavior || !faderSettingsLayer ||
              faderSettingsLayer.bindings.slice(0, 7).some((binding) =>
                binding.behaviorId !== faderBehavior.id || binding.param1 > 6)) {
            throw new Error("フェーダー割り当て対応ファームウェアを確認できません。初回のファームウェア書き込みが必要です。");
          }
          if (state.device !== device) return;

          device.keymap = keymap;
          device.behaviors = behaviors;
          device.faderBehaviorId = faderBehavior.id;
          device.faderSettingsLayer = faderSettingsLayer;
          device.loaded = true;
          elements.restoreStockButton.disabled = false;
          state.activeLayer = 0;
          state.selectedCandidate = null;
          state.selectedKey = null;
          elements.selectionHint.textContent = "接続中のキー候補を選択して、キーに割り当てます。";
          renderLayerTabs();
          refreshCandidates();
          renderKeyboard();
          setStatus(`${device.name} に接続しました。8レイヤー・各38キーを読み込みました。`, "success");
        } finally {
          device.loading = false;
        }
      }

      async function watchDeviceNotifications(device) {
        const reader = device.connection.notification_readable.getReader();
        try {
          while (state.device === device) {
            const { done, value } = await reader.read();
            if (done) break;
            if (value?.core?.lockStateChanged === device.unlockedState) {
              await loadDeviceKeymap(device);
            }
          }
        } finally {
          reader.releaseLock();
        }
        if (state.device === device) throw new Error("USB接続が終了しました。");
      }

      async function disconnectDevice(message = "キーボードとの接続を終了しました。", kind = "") {
        const device = state.device;
        state.device = null;
        elements.connectButton.disabled = false;
        elements.disconnectButton.hidden = true;
        elements.deviceSaveButton.disabled = true;
        elements.restoreStockButton.disabled = true;
        state.selectedCandidate = null;
        state.selectedKey = null;
        elements.selectionHint.textContent = "候補を選択してキーに割り当てます。ドラッグにも対応しています。";
        let abortError = null;
        if (device) {
          try {
            device.transport.abortController.abort();
          } catch (error) {
            abortError = error;
          }
        }
        renderLayerTabs();
        refreshCandidates();
        renderKeyboard();
        setStatus(abortError ? `接続を終了できませんでした: ${abortError.message}` : message, abortError ? "error" : kind);
      }

      elements.connectButton.addEventListener("click", async () => {
        if (!navigator.serial) {
          setStatus("このブラウザーではUSBシリアル接続を利用できません。ChromeまたはEdgeで開くか、公式Studioを利用してください。", "error");
          return;
        }

        elements.connectButton.disabled = true;
        setStatus("USB接続の準備中です。接続するキーボードを選択してください。");
        let pendingTransport = null;
        try {
          const modules = await rpcModulesPromise;
          if (modules.error) throw new Error(`通信ライブラリを読み込めませんでした。インターネット接続を確認してください: ${modules.error.message}`);
          const transport = await modules.serial.connect();
          pendingTransport = transport;
          const connection = await modules.client.create_rpc_connection(transport);
          const infoResponse = await modules.client.call_rpc(connection, {
            core: { getDeviceInfo: true }
          });
          const name = infoResponse.core?.getDeviceInfo?.name;
          if (!name) throw new Error("キーボード情報を取得できませんでした。USB接続とStudio対応ファームウェアを確認してください。");

          const device = {
            client: modules.client,
            core: modules.core,
            transport,
            connection,
            name,
            keymap: null,
            behaviors: new Map(),
            candidateBindings: new Map(),
            unlockedState: modules.core.LockState.ZMK_STUDIO_CORE_LOCK_STATE_UNLOCKED,
            loading: false,
            loaded: false,
            dirty: false
          };
          state.device = device;
          pendingTransport = null;
          elements.disconnectButton.hidden = false;
          void watchDeviceNotifications(device).catch((error) => {
            if (state.device === device) {
              setStatus(`キーボードとの通信に失敗しました: ${error.message}`, "error");
              void disconnectDevice();
            }
          });
          const lockResponse = await device.client.call_rpc(connection, {
            core: { getLockState: true }
          });
          if (lockResponse.core?.getLockState === device.unlockedState) {
            await loadDeviceKeymap(device);
          } else {
            setStatus(`${name} に接続しました。ロック解除キーを押すとキーマップを読み込みます。`);
          }
        } catch (error) {
          if (pendingTransport) {
            try {
              pendingTransport.abortController.abort();
            } catch (abortError) {
              setStatus(`USB接続の終了に失敗しました: ${abortError.message}`, "error");
            }
          }
          await disconnectDevice(`キーボードに接続できませんでした: ${error.message}`, "error");
        } finally {
          if (!state.device) elements.connectButton.disabled = false;
        }
      });

      elements.disconnectButton.addEventListener("click", () => {
        void disconnectDevice();
      });

      elements.deviceSaveButton.addEventListener("click", async () => {
        const device = state.device;
        if (!device?.loaded || !device.dirty) return;
        device.saving = true;
        elements.deviceSaveButton.disabled = true;
        setStatus("キーマップをキーボード本体へ保存しています。");
        try {
          const response = await device.client.call_rpc(device.connection, {
            keymap: { saveChanges: true }
          });
          const result = response.keymap?.saveChanges;
          if (!result?.ok) {
            const reason = result?.err === 3 ? "キーボードの保存領域に空きがありません。" : `保存できませんでした (応答: ${result?.err ?? "なし"})`;
            throw new Error(reason);
          }
          device.dirty = false;
          device.saving = false;
          setStatus("キーマップをキーボード本体へ保存しました。", "success");
        } catch (error) {
          device.saving = false;
          elements.deviceSaveButton.disabled = false;
          setStatus(`キーボードへの保存に失敗しました: ${error.message}`, "error");
        }
      });

      elements.restoreStockButton.addEventListener("click", async () => {
        const device = state.device;
        if (!device?.loaded || device.restoring) return;
        const confirmed = window.confirm(
          "キーボードのStudio設定を破棄し、ファームウェアに含まれる初期キーマップへ戻します。続行しますか？"
        );
        if (!confirmed) return;

        device.restoring = true;
        elements.restoreStockButton.disabled = true;
        elements.deviceSaveButton.disabled = true;
        setStatus("キーボードの初期設定を復元しています。");
        let resetCompleted = false;
        try {
          const response = await device.client.call_rpc(device.connection, {
            core: { resetSettings: true }
          });
          if (!response.core?.resetSettings) {
            throw new Error("キーボードが初期設定の復元を確認しませんでした。");
          }

          resetCompleted = true;
          device.loaded = false;
          device.dirty = false;
          await loadDeviceKeymap(device);
          if (state.device === device && device.loaded) {
            device.restoring = false;
            elements.restoreStockButton.disabled = false;
            elements.deviceSaveButton.disabled = true;
            setStatus("ファームウェアの初期キーマップと設定を復元しました。", "success");
          }
        } catch (error) {
          device.restoring = false;
          elements.restoreStockButton.disabled = !device.loaded;
          elements.deviceSaveButton.disabled = !device.dirty;
          const message = resetCompleted
            ? `初期設定は復元されましたが、再読み込みに失敗しました: ${error.message}`
            : `初期設定の復元に失敗しました: ${error.message}`;
          setStatus(message, "error");
        }
      });

      elements.filePicker.addEventListener("change", async () => {
        const file = elements.filePicker.files && elements.filePicker.files[0];
        if (!file) return;

        try {
          if (state.device) {
            throw new Error("接続中はキーボード上の編集内容を表示しています。ファイルを編集するには先に切断してください。");
          }
          const source = await file.text();
          const layers = parseKeymap(source);
          state.source = source;
          state.fileName = file.name.toLowerCase().endsWith(".keymap") ? file.name : "gridaria.keymap";
          state.layers = layers;
          state.activeLayer = 0;
          state.selectedCandidate = null;
          state.selectedKey = null;
          elements.selectionHint.textContent = "候補を選択してキーに割り当てます。ドラッグにも対応しています。";
          state.dirty = false;
          elements.saveButton.disabled = true;
          setStatus(`${file.name} を読み込みました。8レイヤー・各38キーを確認しました。`, "success");
          renderLayerTabs();
          refreshCandidates();
          renderKeyboard();
        } catch (error) {
          setStatus(`ファイルを読み込めませんでした: ${error.message}`, "error");
        } finally {
          elements.filePicker.value = "";
        }
      });

      elements.saveButton.addEventListener("click", () => {
        if (!state.dirty || !state.source) return;
        const blob = new Blob([state.source], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = state.fileName;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        setStatus(`${state.fileName} をダウンロードしました。config フォルダーのファイルと置き換えてください。`, "success");
      });

      elements.search.addEventListener("input", renderPalette);
      elements.categoryFilter.addEventListener("change", renderPalette);
      elements.customForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const value = elements.customBinding.value.trim();
        if (!isValidBinding(value)) {
          setStatus("バインディング形式が正しくありません。例: &kp F11", "error");
          return;
        }
        if (!state.layers.length) {
          setStatus("先にGridariaのキーマップを開いてください。", "error");
          return;
        }
        state.candidates = [...new Set([...state.candidates, value])];
        state.selectedCandidate = value;
        elements.customBinding.value = "";
        elements.selectionHint.textContent = `選択中: ${value} · 割り当てるキーをクリックしてください。`;
        renderPalette();
        renderKeyboard();
      });

      renderLayerTabs();
      refreshCandidates();
      renderKeyboard();
    })();
  </script>
</body>
</html>
